<title>Arrow Switch installer background</title>
<!--
  Rendered to installer/resources/background*.png by scripts/make-installer-art.sh.
  The mascot is the panel's idle pose (extension/index.html), so the installer and
  the panel look like the same thing.
-->
<style>
  :root { --ink: #3b2a55; }
  html, body { margin: 0; height: 100%; }
  body {
    width: 620px; height: 418px; overflow: hidden;
    background: linear-gradient(170deg, #c9b8ff 0%, #ffc9dd 52%, #ffe1c2 100%);
    font-family: -apple-system, sans-serif;
  }
  body.dark { background: linear-gradient(170deg, #2b2047 0%, #3d2a5e 55%, #4a2f58 100%); --ink: #180f2a; }
  /* Only the left strip (about 184pt) and the header band stay visible: the
     Installer's content pane covers the rest, so the mascot lives bottom-left. */
  .glow { position: absolute; border-radius: 50%; filter: blur(52px); opacity: .5; }
  .glow.a { width: 300px; height: 300px; left: -120px; top: -130px; background: #b49cff; }
  .glow.b { width: 260px; height: 260px; left: -80px; bottom: -90px; background: #ff9ec9; }
  body.dark .glow { opacity: .4; }
  body.dark .glow.a { background: #7555c7; }
  body.dark .glow.b { background: #b4508f; }
  .ring { position: absolute; border: 1.5px solid rgba(59, 42, 85, .09); border-radius: 50%; }
  body.dark .ring { border-color: rgba(255, 255, 255, .08); }
  .r1 { width: 210px; height: 210px; left: -14px; bottom: -44px; }
  .r2 { width: 300px; height: 300px; left: -60px; bottom: -92px; }
  .mascot { position: absolute; left: 92px; bottom: 22px; transform: translateX(-50%); width: 118px; }
  .mascot * { stroke-linecap: round; stroke-linejoin: round; }
  .ball { fill: url(#gMetal); } .grille { fill: url(#pGrille); }
  .gloss { fill: #fff; opacity: .7; }
  .handle { fill: url(#gHandle); } .collar { fill: url(#gGold); }
  .switch { fill: #2a1e3e; } .switch-dot { fill: #ff5f73; }
  .cable, .arm { fill: none; stroke: var(--ink); }
  .cable { stroke-width: 5; } .arm { stroke-width: 6; } .hand { fill: var(--ink); }
  .eye { fill: #fff; stroke: var(--ink); stroke-width: 2.5; }
  .pupils circle { fill: var(--ink); }
  .lid { fill: none; stroke: var(--ink); stroke-width: 3; }
  .brow { fill: none; stroke: var(--ink); stroke-width: 4; }
  .mouth { fill: none; stroke: var(--ink); stroke-width: 3.5; }
  .blush { fill: #ff8fb1; opacity: .75; }
  .floor-shadow { fill: rgba(59, 42, 85, .26); }
  .sparkle { fill: #ffe39a; }
</style>
